<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morrow live view</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #101319; color: #e8edf5; }
    canvas { width: 100%; image-rendering: pixelated; border: 1px solid #3a4353; background: #000; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin: 1rem 0; }
    button, input { font: inherit; }
    button { padding: .45rem .8rem; cursor: pointer; }
    output { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>Morrow 0.1 live view</h1>
  <div class="controls">
    <button id="pause" type="button">Pause</button>
    <button id="step" type="button">Step</button>
    <button id="reset" type="button">New world</button>
    <label>Steps / frame <input id="speed" type="range" min="1" max="30" value="6"><output id="speed-value">6</output></label>
    <output id="stats" aria-live="polite"></output>
  </div>
  <canvas id="world" width="96" height="72" aria-label="Morrow world: body matter is green, resource is blue, waste is red."></canvas>

  <script>
    const height = 72, width = 96, cells = height * width;
    const canvas = document.getElementById('world');
    const context = canvas.getContext('2d');
    const image = context.createImageData(width, height);
    const pause = document.getElementById('pause');
    const speed = document.getElementById('speed');
    const speedValue = document.getElementById('speed-value');
    const stats = document.getElementById('stats');
    let running = true, tick = 0, body, resource, waste, initialMass;

    function index(y, x) { return ((y + height) % height) * width + ((x + width) % width); }
    function mass() { return body.reduce((sum, v, i) => sum + v + resource[i] + waste[i], 0); }
    function gaussian(field, count, radiusMin, radiusMax, strength) {
      for (let n = 0; n < count; n++) {
        const cy = Math.random() * height, cx = Math.random() * width;
        const r = radiusMin + Math.random() * (radiusMax - radiusMin);
        for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
          const dy = Math.min(Math.abs(y - cy), height - Math.abs(y - cy));
          const dx = Math.min(Math.abs(x - cx), width - Math.abs(x - cx));
          field[y * width + x] += strength * Math.exp(-(dx * dx + dy * dy) / (r * r));
        }
      }
    }
    function reset() {
      body = new Float64Array(cells); resource = new Float64Array(cells); waste = new Float64Array(cells);
      gaussian(resource, 7, 6, 16, 1); gaussian(body, 5, 2, 5, .55);
      tick = 0; initialMass = mass(); draw();
    }
    function step() {
      const affinity = new Float64Array(cells), moved = new Float64Array(cells);
      for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
        const i = index(y, x);
        affinity[i] = (body[i] + body[index(y - 1, x)] + body[index(y + 1, x)] + body[index(y, x - 1)] + body[index(y, x + 1)]) / 5 + .35 * resource[i] - .45 * waste[i];
      }
      for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
        const i = index(y, x), targets = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];
        const logits = targets.map(([dy, dx], k) => k ? Math.exp(2 * (affinity[index(y + dy, x + dx)] - affinity[i])) : 1);
        const total = logits.reduce((a, b) => a + b, 0);
        targets.forEach(([dy, dx], k) => { moved[index(y + dy, x + dx)] += body[i] * (.82 * logits[k] / total + .18 / 5); });
      }
      body = moved;
      for (let i = 0; i < cells; i++) {
        const intake = Math.min(resource[i], .07 * body[i] * resource[i]);
        resource[i] -= intake; body[i] += .72 * intake; waste[i] += .28 * intake;
        const decay = .012 * body[i]; body[i] -= decay; waste[i] += decay;
      }
      tick++;
    }
    function draw() {
      const maxBody = Math.max(...body, 1e-9), maxResource = Math.max(...resource, 1e-9), maxWaste = Math.max(...waste, 1e-9);
      for (let i = 0; i < cells; i++) {
        image.data[4 * i] = Math.min(255, 255 * waste[i] / maxWaste);
        image.data[4 * i + 1] = Math.min(255, 255 * body[i] / maxBody);
        image.data[4 * i + 2] = Math.min(255, 255 * resource[i] / maxResource);
        image.data[4 * i + 3] = 255;
      }
      context.putImageData(image, 0, 0);
      stats.value = `step ${tick} · mass drift ${(mass() - initialMass).toExponential(2)}`;
    }
    function animate() { if (running) for (let i = 0; i < +speed.value; i++) step(); draw(); requestAnimationFrame(animate); }
    pause.onclick = () => { running = !running; pause.textContent = running ? 'Pause' : 'Start'; };
    document.getElementById('step').onclick = () => { step(); draw(); };
    document.getElementById('reset').onclick = reset;
    speed.oninput = () => { speedValue.value = speed.value; };
    reset(); animate();
  </script>
</body>
</html>
