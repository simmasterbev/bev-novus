<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bev Novus 2.2 live world</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #101319; color: #e8edf5; }
    canvas { width: 100%; image-rendering: pixelated; border: 1px solid #3a4353; background: #000; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin: 1rem 0; }
    button, input { font: inherit; }
    button { padding: .45rem .8rem; cursor: pointer; }
    output { font-variant-numeric: tabular-nums; }
    details { border: 1px solid #3a4353; padding: .75rem; margin: 1rem 0; }
    summary { cursor: pointer; font-weight: 700; }
    .parameter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .45rem 1rem; margin-top: .75rem; }
    .parameter-grid label { display: grid; grid-template-columns: 1fr auto; gap: .4rem; align-items: center; }
    .parameter-grid input[type="range"] { grid-column: 1 / -1; width: 100%; }
  </style>
</head>
<body>
  <h1>Bev Novus 2.2 live world</h1>
  <div class="controls">
    <button id="pause" type="button">Pause</button>
    <button id="step" type="button">Step</button>
    <button id="reset" type="button">New world</button>
    <label><input id="reproduce" type="checkbox" checked> Seed emission</label>
    <label><input id="recycle" type="checkbox" checked> Recycling</label>
    <label><input id="spatial" type="checkbox" checked> Spatial resources</label>
    <label><input id="mutate" type="checkbox" checked> Mutation</label>
    <label>Steps / frame <input id="speed" type="range" min="1" max="30" value="6"><output id="speed-value">6</output></label>
    <output id="stats" aria-live="polite"></output>
  </div>
  <details open>
    <summary>World rules and starting configuration</summary>
    <div class="parameter-grid">
      <label>Seed <input id="world-seed" type="number" min="0" step="1" value="1"></label>
      <label>Resource patches <input id="resource-patches" type="number" min="1" max="20" step="1" value="7"></label>
      <label>Body patches <input id="body-patches" type="number" min="1" max="20" step="1" value="5"></label>
      <label>Resource strength <output id="resource-strength-value">1.00</output><input id="resource-strength" type="range" min="0.2" max="2" step="0.05" value="1"></label>
      <label>Body strength <output id="body-strength-value">0.55</output><input id="body-strength" type="range" min="0.1" max="1.5" step="0.05" value="0.55"></label>
      <label>Source scale <output id="source-scale-value">1.50</output><input id="source-scale" type="range" min="0.5" max="3" step="0.1" value="1.5"></label>
      <label>Metabolism <output id="metabolism-value">0.070</output><input id="metabolism" type="range" min="0.01" max="0.15" step="0.005" value="0.07"></label>
      <label>Body yield <output id="yield-value">0.72</output><input id="yield" type="range" min="0.2" max="0.95" step="0.01" value="0.72"></label>
      <label>Decay <output id="decay-value">0.012</output><input id="decay" type="range" min="0.001" max="0.05" step="0.001" value="0.012"></label>
      <label>Waste inhibition <output id="waste-value">0.45</output><input id="waste" type="range" min="0" max="0.9" step="0.05" value="0.45"></label>
      <label>Recycle rate <output id="recycle-rate-value">0.025</output><input id="recycle-rate" type="range" min="0" max="0.1" step="0.005" value="0.025"></label>
      <label>Diffusion <output id="diffusion-value">0.18</output><input id="diffusion" type="range" min="0" max="0.5" step="0.01" value="0.18"></label>
      <label>Steering <output id="steering-value">2.0</output><input id="steering" type="range" min="0" max="5" step="0.1" value="2"></label>
      <label>Seed interval <output id="interval-value">120</output><input id="interval" type="range" min="20" max="240" step="10" value="120"></label>
      <label>Seed fraction <output id="fraction-value">0.22</output><input id="fraction" type="range" min="0.05" max="0.5" step="0.01" value="0.22"></label>
      <label>Mutation scale <output id="mutation-scale-value">0.010</output><input id="mutation-scale" type="range" min="0" max="0.1" step="0.005" value="0.01"></label>
      <label>Resource regrowth <output id="regrowth-value">0.006</output><input id="regrowth" type="range" min="0" max="0.03" step="0.001" value="0.006"></label>
      <label>Resource capacity <output id="capacity-value">1.00</output><input id="capacity" type="range" min="0.2" max="3" step="0.1" value="1"></label>
      <label>Waste decay <output id="waste-decay-value">0.002</output><input id="waste-decay" type="range" min="0" max="0.02" step="0.001" value="0.002"></label>
      <label>Waste diffusion <output id="waste-diffusion-value">0.12</output><input id="waste-diffusion" type="range" min="0" max="0.5" step="0.01" value="0.12"></label>
      <label>Dormancy threshold <output id="dormancy-threshold-value">0.08</output><input id="dormancy-threshold" type="range" min="0" max="0.3" step="0.01" value="0.08"></label>
      <label>Dormancy cost <output id="dormancy-cost-value">0.15</output><input id="dormancy-cost" type="range" min="0" max="1" step="0.05" value="0.15"></label>
    </div>
    <div class="controls"><button id="apply-config" type="button">Apply starting world</button><span>Rule sliders apply on the next step; starting-world fields apply when reset.</span></div>
  </details>
  <canvas id="world" width="96" height="72" aria-label="Bev Novus world: body matter is green, resource is blue, waste is red."></canvas>
  <canvas id="history" width="96" height="24" aria-label="History of body mass, structures, and births."></canvas>

  <script>
    const height = 72, width = 96, cells = height * width;
    const canvas = document.getElementById('world');
    const context = canvas.getContext('2d');
    const image = context.createImageData(width, height);
    const pause = document.getElementById('pause');
    const speed = document.getElementById('speed');
    const speedValue = document.getElementById('speed-value');
    const stats = document.getElementById('stats');
    const reproduce = document.getElementById('reproduce'), recycle = document.getElementById('recycle'), spatial = document.getElementById('spatial'), mutate = document.getElementById('mutate');
    const ruleIds = ['resource-strength', 'body-strength', 'source-scale', 'metabolism', 'yield', 'decay', 'waste', 'recycle-rate', 'diffusion', 'steering', 'interval', 'fraction', 'mutation-scale', 'regrowth', 'capacity', 'waste-decay', 'waste-diffusion', 'dormancy-threshold', 'dormancy-cost'];
    let randomState = 1;
    const history = document.getElementById('history'), historyContext = history.getContext('2d');
    let running = true, tick = 0, body, resource, waste, traitMass, mutationMass, source, initialMass, environmentDelta, birthLog, historyLog;

    function random() { randomState = (1664525 * randomState + 1013904223) >>> 0; return randomState / 4294967296; }
    function value(id) { return Number(document.getElementById(id).value); }
    function settings() { return {
      resourceStrength: value('resource-strength'), bodyStrength: value('body-strength'), sourceScale: value('source-scale'),
      metabolism: value('metabolism'), bodyYield: value('yield'), decay: value('decay'), waste: value('waste'), recycleRate: value('recycle-rate'),
      diffusion: value('diffusion'), steering: value('steering'), interval: Math.max(1, value('interval')), fraction: value('fraction'), mutationScale: value('mutation-scale'),
      regrowth: value('regrowth'), capacity: value('capacity'), wasteDecay: value('waste-decay'), wasteDiffusion: value('waste-diffusion'),
      dormancyThreshold: value('dormancy-threshold'), dormancyCost: value('dormancy-cost')
    }; }

    function index(y, x) { return ((y + height) % height) * width + ((x + width) % width); }
    function mass() { return body.reduce((sum, v, i) => sum + v + resource[i] + waste[i], 0); }
    function structures() {
      const peak = Math.max(...body); if (peak <= 0) return 0;
      const cutoff = peak * .25, seen = new Uint8Array(cells); let count = 0;
      for (let i = 0; i < cells; i++) if (body[i] >= cutoff && !seen[i]) {
        const stack = [i]; let size = 0; seen[i] = 1;
        while (stack.length) {
          const cell = stack.pop(), y = Math.floor(cell / width), x = cell % width; size++;
          [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dy, dx]) => {
            const next = index(y + dy, x + dx); if (body[next] >= cutoff && !seen[next]) { seen[next] = 1; stack.push(next); }
          });
        }
        if (size >= 4) count++;
      }
      return count;
    }
    function gaussian(field, count, radiusMin, radiusMax, strength, radiusScale = 1) {
      for (let n = 0; n < count; n++) {
        const cy = random() * height, cx = random() * width;
        const r = radiusMin + random() * (radiusMax - radiusMin);
        for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
          const dy = Math.min(Math.abs(y - cy), height - Math.abs(y - cy));
          const dx = Math.min(Math.abs(x - cx), width - Math.abs(x - cx));
          field[y * width + x] += strength * Math.exp(-(dx * dx + dy * dy) / ((r * radiusScale) * (r * radiusScale)));
        }
      }
    }
    function reset() {
      const config = settings(); randomState = (value('world-seed') >>> 0) || 1;
      body = new Float64Array(cells); resource = new Float64Array(cells); waste = new Float64Array(cells); traitMass = new Float64Array(cells); mutationMass = new Float64Array(cells); source = new Float64Array(cells); birthLog = []; historyLog = [];
      gaussian(resource, value('resource-patches'), 6, 16, config.resourceStrength); gaussian(source, value('resource-patches'), 6, 16, config.resourceStrength, config.sourceScale); gaussian(body, value('body-patches'), 2, 5, config.bodyStrength);
      if (!spatial.checked) resource.fill(resource.reduce((a, b) => a + b, 0) / cells);
      for (let i = 0; i < cells; i++) { traitMass[i] = body[i] * (.35 + .3 * random()); mutationMass[i] = body[i] * (.02 + .06 * random()); }
      tick = 0; environmentDelta = 0; initialMass = mass(); draw();
    }
    function step() {
      const config = settings();
      const affinity = new Float64Array(cells), moved = new Float64Array(cells), movedTraits = new Float64Array(cells), movedMutation = new Float64Array(cells);
      for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
        const i = index(y, x);
        affinity[i] = (body[i] + body[index(y - 1, x)] + body[index(y + 1, x)] + body[index(y, x - 1)] + body[index(y, x + 1)]) / 5 + .35 * resource[i] - config.waste * waste[i];
      }
      for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
        const i = index(y, x), targets = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];
        const logits = targets.map(([dy, dx], k) => k ? Math.exp(config.steering * (affinity[index(y + dy, x + dx)] - affinity[i])) : 1);
        const total = logits.reduce((a, b) => a + b, 0);
        targets.forEach(([dy, dx], k) => {
          const share = (1 - config.diffusion) * logits[k] / total + config.diffusion / 5, target = index(y + dy, x + dx);
          moved[target] += body[i] * share; movedTraits[target] += traitMass[i] * share; movedMutation[target] += mutationMass[i] * share;
        });
      }
      body = moved; traitMass = movedTraits; mutationMass = movedMutation;
      for (let i = 0; i < cells; i++) {
        const trait = body[i] > 1e-12 ? traitMass[i] / body[i] : .5, mutationRate = body[i] > 1e-12 ? mutationMass[i] / body[i] : .04;
        const intake = Math.min(resource[i], config.metabolism * (.5 + trait) * body[i] * resource[i]), growth = config.bodyYield * intake;
        resource[i] -= intake; body[i] += growth; traitMass[i] += trait * growth; mutationMass[i] += mutationRate * growth; waste[i] += (1 - config.bodyYield) * intake;
        const decay = config.decay * body[i] * (body[i] < config.dormancyThreshold ? config.dormancyCost : 1); body[i] -= decay; traitMass[i] -= trait * decay; mutationMass[i] -= mutationRate * decay; waste[i] += decay;
        const regrown = config.regrowth * source[i] * Math.max(0, config.capacity - resource[i]), cleaned = config.wasteDecay * waste[i]; resource[i] += regrown; waste[i] -= cleaned; environmentDelta += regrown - cleaned;
        if (recycle.checked) { const recovered = Math.min(waste[i], config.recycleRate * source[i] * waste[i]); waste[i] -= recovered; resource[i] += recovered; }
      }
      if (config.wasteDiffusion > 0) { const mixed = new Float64Array(cells); for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) { const i = index(y, x); mixed[i] = (waste[i] + waste[index(y - 1, x)] + waste[index(y + 1, x)] + waste[index(y, x - 1)] + waste[index(y, x + 1)]) / 5; } for (let i = 0; i < cells; i++) waste[i] = (1 - config.wasteDiffusion) * waste[i] + config.wasteDiffusion * mixed[i]; }
      tick++;
      if (reproduce.checked && tick % config.interval === 0) bud();
      for (const birth of birthLog) if (!birth.viable && tick - birth.tick >= 30) {
        let local = 0; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) local += body[index(birth.y + dy, birth.x + dx)];
        birth.viable = local >= .4;
      }
    }
    function bud() {
      const source = body.reduce((best, value, i) => value > body[best] ? i : best, 0), y = Math.floor(source / width), x = source % width;
      let donated = 0, traits = 0, mutations = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const i = index(y + dy, x + dx), amount = body[i] * settings().fraction, trait = body[i] > 1e-12 ? traitMass[i] / (body[i] + amount) : .5, mutationRate = body[i] > 1e-12 ? mutationMass[i] / (body[i] + amount) : .04; body[i] -= amount; traitMass[i] -= amount * trait; mutationMass[i] -= amount * mutationRate; donated += amount; traits += amount * trait; mutations += amount * mutationRate;
      }
      if (donated <= 0) return;
      const config = settings(), parentMutation = mutations / donated, childTrait = Math.max(0, Math.min(1, traits / donated + (mutate.checked ? (random() - .5) * parentMutation * 2 : 0))), childMutation = Math.max(.005, Math.min(.2, parentMutation + (mutate.checked ? (random() - .5) * config.mutationScale : 0))), targetY = (y + 12) % height, targetX = (x + 12) % width;
      const kernel = [[1, 2, 1], [2, 4, 2], [1, 2, 1]];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const amount = donated * kernel[dy + 1][dx + 1] / 16, i = index(targetY + dy, targetX + dx); body[i] += amount; traitMass[i] += amount * childTrait; mutationMass[i] += amount * childMutation; }
      birthLog.push({ y: targetY, x: targetX, tick, viable: false });
    }
    function draw() {
      const maxBody = Math.max(...body, 1e-9), maxResource = Math.max(...resource, 1e-9), maxWaste = Math.max(...waste, 1e-9);
      for (let i = 0; i < cells; i++) {
        image.data[4 * i] = Math.min(255, 255 * waste[i] / maxWaste);
        image.data[4 * i + 1] = Math.min(255, 255 * body[i] / maxBody);
        image.data[4 * i + 2] = Math.min(255, 255 * resource[i] / maxResource);
        image.data[4 * i + 3] = 255;
      }
      context.putImageData(image, 0, 0);
      historyLog.push([body.reduce((a, b) => a + b, 0), structures(), birthLog.length]);
      if (historyLog.length > 96) historyLog.shift();
      historyContext.clearRect(0, 0, 96, 24);
      historyContext.strokeStyle = '#77c66e'; historyContext.beginPath(); historyLog.forEach((row, i) => historyContext.lineTo(i, 24 - Math.min(23, row[0] / 100))); historyContext.stroke();
      historyContext.strokeStyle = '#73a7ff'; historyContext.beginPath(); historyLog.forEach((row, i) => historyContext.lineTo(i, 24 - Math.min(23, row[1] * 8))); historyContext.stroke();
      const viable = birthLog.filter(birth => birth.viable).length;
      stats.value = `step ${tick} · structures ${structures()} · births ${birthLog.length}/${viable} viable · balance ${(mass() - initialMass - environmentDelta).toExponential(2)}`;
    }
    function animate() { if (running) for (let i = 0; i < +speed.value; i++) step(); draw(); requestAnimationFrame(animate); }
    pause.onclick = () => { running = !running; pause.textContent = running ? 'Pause' : 'Start'; };
    document.getElementById('step').onclick = () => { step(); draw(); };
    document.getElementById('reset').onclick = reset;
    speed.oninput = () => { speedValue.value = speed.value; };
    function refreshParameterLabels() {
      ruleIds.forEach(id => { const output = document.getElementById(`${id}-value`); if (output) output.value = document.getElementById(id).value; });
    }
    ruleIds.forEach(id => document.getElementById(id).oninput = refreshParameterLabels);
    document.getElementById('apply-config').onclick = reset;
    refreshParameterLabels();
    reset(); animate();
  </script>
</body>
</html>
